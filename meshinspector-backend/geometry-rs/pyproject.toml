[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "zennah-geometry-rs"
version = "0.1.0"
requires-python = ">=3.11"
description = "Optional Rust accelerators for MeshInspector geometry_sdk"

[tool.maturin]
manifest-path = "crates/zennah-geometry-py/Cargo.toml"
python-source = ".."
module-name = "geometry_sdk._zennah_geometry_rs"
