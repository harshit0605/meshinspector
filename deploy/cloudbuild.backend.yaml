# Build + push the backend image on Cloud Build (native linux/amd64).
# Invoked by deploy.sh:
#   gcloud builds submit meshinspector-backend \
#     --config deploy/cloudbuild.backend.yaml --substitutions _IMAGE=<image>
steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]   # Dockerfile uses RUN --mount=type=cache (BuildKit)
    args: ["build", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
options:
  machineType: E2_HIGHCPU_8        # the Rust release build is CPU-heavy
timeout: 2400s                      # allow time for the Rust + deps build
